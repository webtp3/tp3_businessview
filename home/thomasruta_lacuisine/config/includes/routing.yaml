                - { GETvar: L, value: '0', useConfiguration: dev_rp.tld, urlPrepend: 'http://%conf(EXTCONF.dev_rp.defaultLanguageDomain)%' }
                - { GETvar: L, value: '0', useConfiguration: test_rp.tld, urlPrepend: 'http://%conf(EXTCONF.test_rp.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: tp3_site.tld, urlPrepend: 'http://%conf(EXTCONF.tp3_site.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: bettina-mackeprang.de, urlPrepend: 'http://%conf(EXTCONF.bettina_mackeprang.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: honda-lorenz.de, urlPrepend: 'http://%conf(EXTCONF.honda_lorenz.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: lacuisine.de, urlPrepend: 'http://%conf(EXTCONF.lacuisine.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: tai-chi.tp3.de, urlPrepend: 'http://%conf(EXTCONF.tai_chi.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: dev_rp.tld, urlPrepend: 'http://%conf(EXTCONF.dev_rp.defaultLanguageDomain)%' }
                - { GETvar: L, value: '1', useConfiguration: test_rp.tld, urlPrepend: 'http://%conf(EXTCONF.test_rp.defaultLanguageDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: test_rp.tld, urlPrepend: 'http://%conf(EXTCONF.test_rp.defaultLanguageDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: tp3_site.tld, urlPrepend: 'http://%conf(EXTCONF.tp3_site.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: bettina-mackeprang.de, urlPrepend: 'http://%conf(EXTCONF.bettina_mackeprang.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: honda-lorenz.de, urlPrepend: 'http://%conf(EXTCONF.honda_lorenz.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: lacuisine.de, urlPrepend: 'http://%conf(EXTCONF.lacuisine.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: tai-chi.tp3.de, urlPrepend: 'http://%conf(EXTCONF.tai_chi.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: dev_rp.tld, urlPrepend: 'http://%conf(EXTCONF.dev_rp.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: test_rp.tld, urlPrepend: 'http://%conf(EXTCONF.test_rp.englishDomain)%' }
                - { GETvar: L, value: '2', useConfiguration: default.tld, urlPrepend: 'http://%conf(EXTCONF.helhum_site_package.englishDomain)%' }

            decode:
                '%conf(EXTCONF.tp3_site.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: tp3_site.tld
                '%conf(EXTCONF.bettina_mackeprang.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: bettina-mackeprang.de
                '%conf(EXTCONF.honda_lorenz.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: honda-lorenz.de
                '%conf(EXTCONF.lacuisine.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: lacuisine.de
                '%conf(EXTCONF.tai_chi.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: tai-chi.tp3.de
                '%conf(EXTCONF.dev_rp.defaultLanguageDomain)%':
                    GETvars: { L: '0' }
                    useConfiguration: dev.r-p-it.com
                '%conf(EXTCONF.tp3_site.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: default.tld
                '%conf(EXTCONF.bettina_mackeprang.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: bettina-mackeprang.de
                '%conf(EXTCONF.honda_lorenz.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: honda-lorenz.de
                '%conf(EXTCONF.lacuisine.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: lacuisine.de
                '%conf(EXTCONF.tai_chi.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: tai-chi.tp3.de
                '%conf(EXTCONF.dev_rp.englishDomain)%':
                    GETvars: { L: '2' }
                    useConfiguration: dev.r-p-it.com


        default.tld:
            init:
                enableCHashCache: true
                appendMissingSlash: 'ifNotFile'
                adminJumpToBackend: true
                enableUrlDecodeCache: true
                enableUrlEncodeCache: true
                emptyUrlReturnValue: /
                disableErrorLog: true
            pagePath:
                rootpage_id: '690'
                type: user
                userFunc: 'Tx\Realurl\UriGeneratorAndResolver->main'
                spaceCharacter: '-'
                languageGetVar: 'L'
                expireDays: 3
                dontResolveShortcuts: false
            fileName:
                defaultToHTMLsuffixOnPrev: false
