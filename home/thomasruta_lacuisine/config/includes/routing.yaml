EXTCONF:
    realurl:
        _DOMAINS:
            encode:

                - { GETvar: L, value: '0', useConfiguration: tp3_site.tld, urlPrepend: 'http://%conf(EXTCONF.tp3_site.defaultLanguageDomain)%' }
