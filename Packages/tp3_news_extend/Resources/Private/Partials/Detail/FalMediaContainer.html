<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  xmlns:vh="http://typo3.org/ns/Tp3/Filmcomission/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<f:if condition="{uid} == 55">
	<div class="news-img-wrap" style="width: 550px;">
		<f:cObject typoscriptObjectPath="tt_content.list.20.html5videoplayer_pivideoplayer">2</f:cObject>
	</div>
</f:if>

<f:if condition="{media}">
	<!-- fal media files -->
	<div class="news-img-wrap">
		<f:for each="{media}" as="mediaElement">
			<f:if condition="{vh:ImageVisible(media:mediaElement)}">
				<div class="outer">
					<f:if condition="{mediaElement.originalResource.type} == 2">
						<f:render partial="Detail/FalMediaImage" arguments="{mediaElement: mediaElement, settings:settings}"/>
					</f:if>
					<f:if condition="{mediaElement.originalResource.type} == 4">
						<f:render partial="Detail/FalMediaVideo" arguments="{mediaElement: mediaElement, settings:settings}"/>
					</f:if>
					<f:if condition="{mediaElement.originalResource.type} == 5">
						<f:render partial="Detail/FalMediaImage" arguments="{mediaElement: mediaElement, settings:settings}"/>
					</f:if>
				</div>
			</f:if>
		</f:for>
	</div>
</f:if>
