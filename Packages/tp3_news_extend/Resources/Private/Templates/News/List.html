<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  xmlns:vh="http://typo3.org/ns/Tp3/Filmcomission/ViewHelpers"
	  data-namespace-typo3-fluid="true">

<f:layout name="General" />
<!--
	=====================
		Templates/News/List.html
-->

<f:section name="content">
	<!--TYPO3SEARCH_end-->
	<f:if condition="{news}">
		<f:then>

			<f:comment>startseite newslist</f:comment>
			<f:if condition="{settings.templateLayout} == 1">
				<f:then>
					<div class="news-list-view newsLatestHome news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
						<f:if condition="{settings.hidePagination}">
							<f:then>
								<f:for each="{news}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</f:then>
							<f:else>
								<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit}">
									<div class="news-panel">
										<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
											<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
										</f:for>
									</div>
								</n:widget.paginate>
							</f:else>
						</f:if>
					</div>
				</f:then>
			</f:if>

			<f:comment>normale newslist</f:comment>
			<f:if condition="{settings.templateLayout} == 11">
				<f:then>
					<div class="news-list-view news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
						<f:if condition="{settings.hidePagination}">
							<f:then>
								<f:for each="{news}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</f:then>
							<f:else>
								<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit,recordId:contentObjectData.uid}">
									<div class="news-panel">
										<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
											<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
										</f:for>
									</div>
								</n:widget.paginate>
							</f:else>
						</f:if>
					</div>
				</f:then>
			</f:if>
			<f:comment>startseite eventliste</f:comment>
			<f:if condition="{settings.templateLayout} == 2">
				<div class="news-list-view eventsLatestHome" id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
						</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit}">
								<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</n:widget.paginate>
						</f:else>
					</f:if>
				</div>
			</f:if>

			<f:comment>startseite press</f:comment>
			<f:if condition="{settings.templateLayout} == 3">
				<div class="news-list-view newsLatestHome pressLatestHome" id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
						</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit}">
									<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
									</f:for>
								</n:widget.paginate>
							</f:else>
						</f:if>
					</div>
			</f:if>

			<f:comment>normale presseliste</f:comment>
			<f:if condition="{settings.templateLayout} == 13">
				<div class="news-list-view press"  id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
				</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit}">
								<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</n:widget.paginate>
						</f:else>
					</f:if>
				</div>
			</f:if>


			<f:comment>news boxes</f:comment>
			<f:if condition="{settings.templateLayout} == 14">
				<div class="isotop button">
					<div  id="isotop_handle" class="texticon-icon texticon-size-default texticon-type-circle"><span class="texticon-inner-icon glyphicon glyphicon-cog" style="color: #7d7d7d; background-color: #fff;"></span></div>
				</div>
				<f:if condition="!{settings.hidePagination}">
					<f:render partial="General/IsotopeControls" arguments="{_all}" />
				</f:if>
				<div class="news-list-view boxes news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<div class="news-panel">
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Box" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
							</div>
						</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit,recordId:contentObjectData.uid}">
								<div class="news-panel">
									<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
										<f:render partial="List/Box" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
									</f:for>
								</div>
							</n:widget.paginate>

						</f:else>
					</f:if>
				</div>


			</f:if>
		<f:comment>news isotop</f:comment>
		<f:if condition="{settings.templateLayout} == 15">
			<f:then>
<!--				<div class="isotop button">-->
<!--					<div   class="texticon-icon texticon-size-default texticon-type-circle"><span class="texticon-inner-icon glyphicon glyphicon-cog" style="color: #7d7d7d; background-color: #fff;"></span></div>-->
<!--				</div>-->
				<f:if condition="!{settings.hidePagination}">
					<f:render partial="General/IsotopeControls" arguments="{_all}" />
				</f:if>
				<div class="news-list-view isotop news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<div class="news-panel">
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Box" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
							</div>
						</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit,recordId:contentObjectData.uid}">
								<div class="news-panel">
									<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
										<f:render partial="List/Box" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
									</f:for>
								</div>
							</n:widget.paginate>

						</f:else>
					</f:if>

				</div>


			</f:then>
		</f:if>
		</f:then>
		<f:if condition="{settings.templateLayout} < 1">
			<f:then>
				<f:if condition="{settings.hidePagination}">
					<f:render partial="General/IsotopeControls" arguments="{_all}" />
				</f:if>
				<div class="news-list-view news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
					<f:if condition="{settings.hidePagination}">
						<f:then>
							<f:for each="{news}" as="newsItem" iteration="iterator">
								<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
							</f:for>
						</f:then>
						<f:else>
							<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit,recordId:contentObjectData.uid}">
								<div class="news-panel">
								<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								</div>
							</n:widget.paginate>
						</f:else>
					</f:if>
				</div>
			</f:then>
		</f:if>
		<f:else>
			<div class="news-list-view news-layout{settings.templateLayout}" id="news-container-{contentObjectData.uid}">
				<f:if condition="{settings.hidePagination}">
					<f:then>
						<f:for each="{news}" as="newsItem" iteration="iterator">
							<f:render partial="List/StyleItem" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
						</f:for>
					</f:then>
					<f:else>
						<n:widget.paginate objects="{news}" as="paginatedNews" configuration="{settings.list.paginate}" initial="{offset:settings.offset,limit:settings.limit,recordId:contentObjectData.uid}">
							<div class="news-panel">
								<f:for each="{paginatedNews}" as="newsItem" iteration="iterator">
									<f:render partial="List/StyleItem" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
							</div>
						</n:widget.paginate>
					</f:else>
				</f:if>
			</div>
		</f:else>
	</f:if>

	<!--TYPO3SEARCH_begin-->
</f:section>
</html>
