<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <div class="tp3businessview-controls ">
    <button type="button" data-toggle="button" class="btn btn-secondary" id="btn-controls">open controls</button>
    <button type="button" data-toggle="button" class="btn btn-secondary" id="btn-links">open links</button>
    </div>
    <table id="links_table"></table>
    <div class="tp3businessview-controls tp3-panel">
               <div class="color-controls">
                   <span><b>color</b></span>
                   <span class="color">
                        <input required="required" type="text" name="settings[color]" value="{settings.color}" class="formvalue" />
                    </span>
               </div>
               <div class="backgroundColor-controls">
                   <span><b>backgroundColor</b></span>
                   <span class="backgroundColor">
                        <input required="required" type="text" name="settings[backgroundColor]" value="{settings.backgroundColor}" class="formvalue" />
                    </span>
               </div>
               <div class="textColor-controls">
                   <span><b>textColor</b></span>
                   <span class="textColor">
                        <input required="required" type="text" name="settings[textColor]" value="{settings.textColor}" class="formvalue" />
                    </span>
               </div>
               <div class="align-controls">
                   <span><b>align</b></span>
                   <span class="align">
                        <input required="required" type="text" name="settings[align]" value="{settings.align}" class="formvalue" />
                    </span>
               </div>
               <div class="panoJumpTimer-controls">
                   <span><b>panoJumpTimer</b></span>
                   <span class="panoJumpTimer">
                        <input required="required" type="text" name="settings[panoJumpTimer]" value="{settings.panoJumpTimer}" class="formvalue" />
                    </span>
               </div>
                <div class="panoJumpsRandom-controls">
                    <span><b>panoJumpsRandom</b></span>
                    <span class="panoJumpsRandom">
                        <input type="checkbox" name="settings[panoRotationFactor]" value="1" class="formvalue" {f:if(condition: settings.panoJumpsRandom, then: 'checked="checked"')} />
                    </span>
                </div>
               <div class="panoRotationTimer-controls">
                   <span><b>panoRotationTimer</b></span>
                   <span class="panoRotationTimer">
                        <input required="required" type="text" name="settings[panoRotationTimer]" value="{settings.panoRotationTimer}" class="formvalue" />
                    </span>
               </div>
               <div class="panoRotationFactor-controls">
                   <span><b>panoRotationFactor</b></span>
                   <span class="panoRotationFactor">
                        <input required="required" type="text" name="settings[panoRotationFactor]" value="{settings.panoRotationFactor}" class="formvalue" />
                               <button type="button" data-toggle="button" class="btn btn-secondary" id="btn-panoRotationFactor-minus">-</button>
                               <button type="button" data-toggle="button" class="btn btn-secondary" id="btn-panoRotationFactor-plus">+</button>

                    </span>
               </div>

           </div>
    </div>
    <div class="tp3businessview-controls pano-panel">



    </div>
</html>
