<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<style>

</style>
<!-- https://developers.google.com/maps/documentation/javascript/streetview?hl=de
https://developers.google.com/maps/documentation/javascript/examples/streetview-custom-simple?hl=de -->
<input id="pac-input" class=tp3businessview-controls" type="text" placeholder="Enter a location" style="width: 275px">
<div class="reversesearch">if you have a place ID
<input id="placeid" type="text" value="">
    <input id="reversesubmit" type="button" value="Reverse Geocode by Place ID"><br>
or search for the place on the map</div>
<div id="infowindow-content">
    <span id="place-name"  class="title"></span><br>
    Place ID <span id="place-id"></span><br>
    <span id="place-address"></span>
</div>
<div id="map"></div>
<div id="businessview-canvas"> <div id="PanoPlayer" class="player-controls">
    <div class="fa fa-minus-square"></div>
    <div class="fa fa-plus-square"></div>
    <!-- <div class="fa fa-backward"></div> -->
    <div class="fa fa-play"></div>
    <div class="fa fa-pause"></div>
   <!-- <div class="fa fa-forward"></div> -->

</div><div id="businessview-panorama-canvas"></div></div>
<div id="tp3businessview-floating-panel">
    <form id="editform">
    <input type="hidden" name="panoramas[uid]" class="formvalue" />
    <input type="hidden" name="panoramas[pid]" class="formvalue" />
        <select name="tp3businessview[uid]" class="form-control formvalue">
            <f:for each="{businessviews}" as="businessview">
                <option value="{businessview.uid}">{businessview.name}</option>
            </f:for>
        </select>
        <table class="panoviewer">
        <tr>
            <td><b>Titel</b></td>
            <td class="title">
               <input required="required" type="text" name="panoramas[title]" class="formvalue" />
            </td>
        </tr><tr>
            <td><b>Position</b></td><td ><input type="text" name="panoramas[position]" id="position-cell" class="formvalue" />
            </td>
        </tr>
        <tr>
            <td><b>POV Heading</b></td><td >
            <input type="text" name="panoramas[heading]" id="heading-cell" class="formvalue" />
        </td>
        </tr>
        <tr>
            <td><b>POV Pitch</b></td><td >
            <input type="text" name="panoramas[pitch]" id="pitch-cell" class="formvalue" />
        </td>
        </tr>
        <tr>
            <td><b>Pano ID</b></td><td >
            <input required="required" type="text" name="panoramas[panoId]" id="pano-cell" class="formvalue" />
        </td>
        </tr>
        <tr>
            <td><b>Zoom</b></td><td >
            <input type="text" name="panoramas[zoom]" id="zoom-cell" class="formvalue" />
        </td>
        </tr>

    </table>
        <input type="submit" name="submit" id="submitEditform" value="save" />
        <input type="submit" name="submit" id="submitNewform" value="new" />

    </form>
    <f:render partial="Tp3BusinessView/Controls" arguments="{settings:settings}" />

</div>
