<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="main">
	<div class="tp3-businessview panel">
		<div class="row tp3-businessview-title">
    <h1>Tp3 BusinessView Designer (Streetview)</h1>
			<f:render partial="Tp3BusinessView/Finder" arguments="{_all}" />
    <br>
		</div>
		<div class="row tp3-businessview-canvas">
    <div class="recordlists">
        <f:if condition="{businessviews->f:count()} < 1}">
            <f:then>
						<f:render partial="Tp3BusinessView/Intro" arguments="{_all}" />

            </f:then>
            <f:else>
                <div class="businessviewlist clearfix">
                    <h2>Businessviews</h2>
                    <f:for each="{businessviews}" as="businessview" iteration="Iterator">
                        <f:if condition="{Iterator.index} < 1">
                            <f:then>
                                <div class="head">
                                    <f:render partial="Tp3BusinessView/Labels" arguments="{properties:businessview.propertiesArray}" />
                                </div>
                            </f:then>
                        </f:if>
                        <div id="bw_{businessview.uid}_{businessview.pid}" class="bwentry">
                            <f:render partial="Tp3BusinessView/Properties" arguments="{properties:businessview.propertiesArray}" />

                        </div>
                        <table id="bw_{Iterator.index}_{businessview.uid}" class="panolist bwlist">
                            <tr>
                                <td><b>Titel</b></td>
                                <td><b>Pano ID</b></td>
                                <td><b>POV Heading</b>/<b>POV Pitch</b>/<b>zoom</b></td>
                                <td><b>Position</b></td>
                                <td><b>Sorting</b></td>
                            </tr>
									<f:for each="{businessviews.panoramas}" as="panorama">
                                <f:render partial="Tp3BusinessView/Panorama" arguments="{panorama:panorama, settings:settings}" />
                            </f:for>
                        </table>
                    </f:for>
                </div>
                <h2>Panoramas</h2>
                <table class="panolist">
                    <tr>
                        <td><b>Titel</b></td>
                        <td><b>Pano ID</b></td>
                        <td><b>POV Heading</b>/<b>POV Pitch</b>/<b>zoom</b></td>
                        <td><b>Position</b></td>
                        <td><b>Sorting</b></td>
                    </tr>
							<f:for each="{panoramas}" as="panorama">
                        <f:render partial="Tp3BusinessView/Panorama" arguments="{_all}" />
                    </f:for>
                </table><br>
                <h2>Business </h2>
                <table class="addresslist">
                    <tr> <td><b>name</b></td>
                        <td><b>google place_id</b></td>
                        <td><b>geo</b></td></tr>
							<f:for each="{addresses}" as="address">
                            <f:render partial="Tp3BusinessView/Address" arguments="{_all}}" />
                        </f:for>
                </table>

            </f:else>
        </f:if>

				<div
					id="tp3-businessview-app"
					data-json-url="{jsonUrl}"
					data-api-key="{googleMapsJavaScriptApiKey}"
					data-pid="{id}"
				></div>

            window.businessviewJsonsArray[{Iterator.index}]=<f:format.raw>{Json}</f:format.raw>;
            </f:for>
        </f:asset.script>

    </div>
</f:section>
</html>
