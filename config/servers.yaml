# list servers
# -------------
dev:
    hostname: localdev.tp3.de
    port: 22
    user: 'dev'
    public_key:  'config/keys/id_rsa.pub'
    private_key: 'config/keys/id_rsa'
    password:    'jpb0OIJlmCmiRT9hP5Pu'

    configFile: config/keys/ssh_config
    identityFile: config/keys/id_rsa
    forwardAgent: true
    multiplexing: true
    stage: dev
    deploy_path: /develop/dev-rp/private/
    typo3_webroot: ../../../web/
    #// Project path
    application: /tmp

    #// Project repository
    repository: git@bitbucket.org:web-tp3/dev-rp.git
    git_tty: true
    keep_releases: 4

    #// Shared files/dirs between deploys
    shared_files: ['.env','config/local.settings.yaml']
    shared_dirs: []

    #// Writable dirs by web server
    writable_dirs: ['../tmp/','_temp']
    branch: develop

stage:
    hostname: praxis.tp3.de
    port: 22
    user: r_p_it_praxis
    public_key:  'config/keys/id_rsa.pub'
    private_key: 'config/keys/id_rsa'
    password:    'jpb0OIJlmCmiRT9hP5Pu'
    configFile: config/keys/ssh_config
    identityFile: ''
    forwardAgent: true
    multiplexing: true
    stage: develop
    sshOptions:
