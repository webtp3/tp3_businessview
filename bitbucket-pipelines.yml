image: webtp3/docker
options:
  docker: true
pipelines:
  default:

    - step:
        name: Deploy to testing
        deployment: test
        image: webtp3/docker:16.4-bundle
        caches:
          - composer
        script:
          #- apt-get update && apt-get upgrade -y
          - rsync -a /opt/atlassian/pipelines/agent/build/ /var/www/html
          - ls -an /opt/atlassian/pipelines/agent/build/
          - chown -R typo3user:www-data /var/www/html/
          - chmod 775 -R /var/www/html/

          # start composer install
          - composer config  repositories.local path 'Packages/*' -d  /var/www/html/
          - composer --dev install -d  /var/www/html/

          # start typo3 install from env
          - bash /var/www/cgi-bin/run-typo3.sh
          # start testing
          - php /var/www/html/vendor/phpunit/phpunit/phpunit --configuration /var/www/html/web/typo3conf/ext/cag_tests/Tests/Build/UnitTests.xml --teamcity
          - php /var/www/html/vendor/phpunit/phpunit/phpunit --configuration /var/www/html/web/typo3conf/ext/cag_tests/Tests/Build/UnitTestsDeprecated.xml --teamcity
          - php /var/www/html/vendor/phpunit/phpunit/phpunit --configuration /var/www/html/web/typo3conf/ext/cag_tests/Tests/Build/FunctionalTests.xml --teamcity
          - mkdir -p /var/www/html/web/typo3temp/var/tests
          - /var/www/html/vendor/bin/chromedriver --url-base=/wd/hub >/dev/null 2>&1 &
          - php -S 0.0.0.0:8000 >/dev/null 2>&1 &
          - sleep 3;
          - typo3DatabaseName='typo3' typo3DatabaseHost='localhost' typo3DatabaseUsername='root' typo3DatabasePassword='my-secret-pw' vendor/codeception/codeception/codecept run Acceptance -c web/typo3conf/ext/cag_tests/Tests/Build/AcceptanceTests.yml
